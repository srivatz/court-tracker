<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badminton Court Portal</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Core SDK Scripts -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
</head>
<body>
  <div class="portal-container">
    
    <!-- Authentication Layer Wrapper -->
    <div id="authWrap" class="panel-card">
      <h2>🏸 Court Tracker Entry Portal</h2>
      <input type="email" id="authEmail" placeholder="Email Address" style="margin-bottom:12px;">
      <input type="password" id="authPassword" placeholder="Password Fields">
      <button onclick="submitAuth()" style="margin-top:14px;">Access Portal Account</button>
    </div>

    <!-- Protected Application Views Layout Skeletons -->
    <div id="appWrap" style="display:none;">
      
      <!-- Admin Action Bars Panel Elements -->
      <div id="adminBar" class="panel-card" style="display:none; border-color:var(--brand-accent);"></div>

      <!-- Core Interactive Calendar View Section -->
      <div class="panel-card">
        <h2>🗓️ Select Dates & Manage Availability</h2>
        <div class="sub">Click on highlighted match dates to mark your presence or change attendance status flag flags.</div>
        <div id="calendarDisplayGrid" class="interactive-calendar"></div>
      </div>

      <!-- Live Calculated Balances Overview Layout Panel Elements -->
      <div class="panel-card">
        <h2>💰 Personal Ledger and Cost Splits Summary</h2>
        <div id="userLedgerDisplay" class="sub">Loading financial distributions...</div>
      </div>

    </div>
  </div>

  <!-- Internal Business Infrastructure Code Modules Imports -->
  <script src="app-config.js"></script>
  <script src="module-expenses.js"></script>
  <script src="module-sessions.js"></script>
  <script src="module-auth.js"></script>
</body>
</html>
