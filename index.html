  <script>
    window.authMode = 'login';
    
    function showAuthTab(mode) {
      window.authMode = mode;
      const loginTab = document.getElementById('loginTabBtn');
      const registerTab = document.getElementById('registerTabBtn');
      const title = document.getElementById('authTitle');
      const subText = document.getElementById('authSubText');
      const actionBtn = document.getElementById('authSubmitActionBtn');
      
      if (mode === 'login') {
        loginTab.style.background = 'var(--brand-accent)';
        loginTab.style.color = '#fff';
        registerTab.style.background = 'var(--bg-app)';
        registerTab.style.color = 'var(--text-main)';
        title.innerText = "🏸 Court Tracker Sign In";
        subText.innerText = "Enter your credentials to access the court logs.";
        actionBtn.innerText = "Sign In";
      } else {
        registerTab.style.background = 'var(--brand-accent)';
        registerTab.style.color = '#fff';
        loginTab.style.background = 'var(--bg-app)';
        loginTab.style.color = 'var(--text-main)';
        title.innerText = "🏸 Create Portal Account";
        subText.innerText = "Sign up to request group access from the admin.";
        actionBtn.innerText = "Submit Request";
      }
    }
  </script>
